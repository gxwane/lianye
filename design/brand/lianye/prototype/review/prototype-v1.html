      if(edge==='left'){const right=c.x+c.w;c.x=Math.min(value,right-.1);c.w=right-c.x;}
      if(edge==='right')c.w=Math.max(.1,1-value-c.x);
      temp=M.cleanEdit(temp);updateEditVisual();
    }
    if(el.dataset.maskField&&selectedMask>=0){const k=el.dataset.maskField;temp.masks[selectedMask][k]=Number(el.value)/100;temp=M.cleanEdit(temp);updateEditVisual();}
  });
  root.addEventListener('pointerdown',event=>{
    if(event.button!==0)return;
    const bubble=event.target.closest('.ly-bubble');
    if(bubble){drag={type:'bubble',node:bubble,startX:event.clientX,startY:event.clientY,y:bubbleY,moved:false};bubble.setPointerCapture(event.pointerId);return;}
    const image=event.target.closest('.ly-edit-image');if(!image||!tool)return;
    const rect=image.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
    const corner=event.target.closest('[data-corner]');
    if(corner){drag={type:'crop',node:corner,corner:corner.dataset.corner,original:{...temp.crop},startX:event.clientX,startY:event.clientY,rect,moved:false};corner.setPointerCapture(event.pointerId);event.preventDefault();}
    else if(tool==='mask'&&!maskPan){
      const c=temp.crop,sx=c.x+x*c.w,sy=c.y+y*c.h;
      const hit=temp.masks.findIndex(m=>sx>=m.x&&sx<=m.x+m.w&&sy>=m.y&&sy<=m.y+m.h);
      if(hit>=0){selectedMask=hit;render();return;}
      const px=Math.max(c.x,Math.min(c.x+c.w-.02,sx)),py=Math.max(c.y,Math.min(c.y+c.h-.01,sy));
      const previousSelection=selectedMask;
      temp.masks.push({x:px,y:py,w:.02,h:.01});selectedMask=temp.masks.length-1;
      drag={type:'mask',node:image,x:px,y:py,rect,crop:{...c},previousSelection,moved:false};image.setPointerCapture(event.pointerId);event.preventDefault();updateEditVisual();
    }
  });
  root.addEventListener('pointermove',event=>{
    if(!drag)return;
    if(drag.type==='bubble'){
      const dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
      if(drag.moved){bubbleY=Math.max(70,Math.min(590,drag.y+dy));bubbleSide=event.clientX<screen.getBoundingClientRect().left+screen.clientWidth/2?'left':'right';drag.node.style.top=bubbleY+'px';drag.node.style.left=bubbleSide==='left'?'8px':'auto';drag.node.style.right=bubbleSide==='right'?'8px':'auto';}
    } else if(drag.type==='crop'){
      drag.moved=true;moveCorner(drag.corner,(event.clientX-drag.startX)/drag.rect.width,(event.clientY-drag.startY)/drag.rect.height,drag.original);
    } else {
      drag.moved=true;const c=drag.crop;
      const x=c.x+Math.max(0,Math.min(1,(event.clientX-drag.rect.left)/drag.rect.width))*c.w,y=c.y+Math.max(0,Math.min(1,(event.clientY-drag.rect.top)/drag.rect.height))*c.h;
      temp.masks[selectedMask]={x:Math.min(drag.x,x),y:Math.min(drag.y,y),w:Math.max(.02,Math.abs(x-drag.x)),h:Math.max(.01,Math.abs(y-drag.y))};temp=M.cleanEdit(temp);updateEditVisual();
    }
  });
  function endDrag(){if(!drag)return;const old=drag;if(old.type==='mask'){if(!old.moved){temp.masks.pop();selectedMask=old.previousSelection;}render();}setTimeout(()=>{drag=null;},0);}
  root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
  root.addEventListener('keydown',event=>{
    const corner=event.target.dataset.corner;
    if(corner&&temp&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
      event.preventDefault();moveCorner(corner,event.key==='ArrowLeft'?-.01:event.key==='ArrowRight'?.01:0,event.key==='ArrowUp'?-.01:event.key==='ArrowDown'?.01:0,{...temp.crop});return;
    }
    if(event.key==='Escape'){if(s.sheet){event.preventDefault();closeSheet();}else if(tool){event.preventDefault();finishEdit(false);}}
    if(event.key==='Tab'&&s.sheet){
      const controls=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled)')];
      if(!controls.length)return;const first=controls[0],last=controls.at(-1);
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  const ro=new ResizeObserver(()=>{
    const width=screen.clientWidth;if(Math.abs(width-lastPhoneWidth)>1){lastPhoneWidth=width;if(s.screen==='result'||tool)render({focus:false});}
  });ro.observe(screen);
  function applyDesign(){root.style.setProperty('--ly-radius',design.radius+'px');root.style.colorScheme=design.appearance==='system'?'inherit':design.appearance;}
  function restore(value){const state=value?.privateContent;
    if(!state||state.version!==1||state.stamp===lastSavedStamp||state.stamp?.startsWith(instanceStamp+':'))return;
    const restored=state.experience;
    if(!restored||![...scenarioSelect.options].some(o=>o.value===restored.scenario))return;
    try {
      const next=JSON.parse(JSON.stringify(restored));
      if(next.draft){
        if(!Array.isArray(next.draft.history)||!next.draft.history.length)return;
        next.draft.history=next.draft.history.map(M.cleanEdit);
        next.draft.index=Math.max(0,Math.min(next.draft.history.length-1,Math.round(next.draft.index)));
        next.draft.frames=Math.max(1,Math.min(4,next.draft.frames));next.draft.height=540+(next.draft.frames-1)*360;
      }
      stopTimers();s=next;s.sheet=null;tool=null;temp=null;pendingExit=null;
      if(s.screen==='capturing'){M.finishCapture(s,true);s.projection=false;}
      if(!['home','system','desktop','target','result','settings','help'].includes(s.screen)||s.screen==='result'&&!s.draft)s.screen='home';
      scenarioSelect.value=s.scenario;
      if(['system','light','dark'].includes(state.appearance))design.appearance=state.appearance;
      zoom=Math.max(.5,Math.min(2.5,state.zoom||1));bubbleY=Math.max(70,Math.min(590,state.bubbleY||245));bubbleSide=state.bubbleSide==='left'?'left':'right';
      lastSavedStamp=state.stamp;applyDesign();render({focus:false});
    }catch{}
  }
  render();applyDesign();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});
    tweak.addSlider(design,'radius',{label:'内容圆角',min:12,max:28,step:2,unit:'px',reference:'--ly-radius'});
    tweak.addSelect(design,'appearance',{label:'外观',options:[{label:'跟随环境',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});
  }
})();

</script>
