  <title id="title">连页 · Gamma 03 · 生长拍</title>
  <desc id="desc">从连续向下增长的动态节奏出发的原创黑白探索。三枚独立宽面由上到下变宽、变厚，斜切起端与圆弧末端形成不对称的逐级展开轮廓。包含大图、96、64、32、24 像素和反白图标对照。</desc>
