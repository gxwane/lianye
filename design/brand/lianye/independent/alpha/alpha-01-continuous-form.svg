<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">连页：方向 A，续幅</title>
  <desc id="desc">原创黑白标识探索。上下两段宽幅由一段宽而错位的连续实体接续。画面展示一个大标识、48、32、24 像素的尺寸对照和黑色圆角容器中的反白标识。</desc>
  <defs>
    <symbol id="mark" viewBox="24 20 216 260">
      <path fill="currentColor" d="M56 20H200Q232 20 232 52V98Q232 114 216 126L146 178H208Q240 178 240 210V248Q240 280 208 280H64Q32 280 32 248V218Q32 202 56 188L140 124H56Q24 124 24 92V52Q24 20 56 20Z"/>
    </symbol>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <g fill="#000" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="60" y="70" font-size="34" font-weight="700">连页 ／ A　续幅</text>
    <text x="60" y="110" font-size="17">把上下两段宽幅收成一个连续实体；接续发生在轮廓里面。</text>
    <path d="M60 150H1140" fill="none" stroke="#000" stroke-width="1"/>
    <text x="60" y="191" font-size="14">主标识</text>
    <use href="#mark" x="150" y="228" width="280" height="337" color="#000"/>
    <text x="640" y="191" font-size="14">原生尺寸检验</text>
    <use href="#mark" x="645" y="252" width="48" height="48" color="#000"/>
    <use href="#mark" x="815" y="260" width="32" height="32" color="#000"/>
    <use href="#mark" x="983" y="264" width="24" height="24" color="#000"/>
    <text x="645" y="337" font-size="14">48 px</text>
    <text x="810" y="337" font-size="14">32 px</text>
    <text x="975" y="337" font-size="14">24 px</text>
    <text x="640" y="402" font-size="14">图标容器 / 反白</text>
    <rect x="640" y="431" width="160" height="160" rx="38"/>
    <use href="#mark" x="682" y="465" width="77" height="93" color="#fff"/>
    <text x="836" y="476" font-size="17" font-weight="700">一块形状，一次接续。</text>
    <text x="836" y="511" font-size="15">宽幅的两端保留分段感，</text>
    <text x="836" y="539" font-size="15">中间的斜向实体保持不断。</text>
    <path d="M60 649H1140" fill="none" stroke="#000" stroke-width="1"/>
    <text x="60" y="690" font-size="15">观察重点：斜向连接在 24 px 是否仍然够厚；整体是否容易被读成字母 Z。</text>
    <text x="60" y="722" font-size="13">Alpha 独立探索 · 黑白结构稿 · 2026-10-03</text>
  </g>
</svg>
