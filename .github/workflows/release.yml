name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > lianye-release.jks

      - name: Build signed Release APK
        env:
          storeFile: ${{ github.workspace }}/lianye-release.jks
          storePassword: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease verifyZeroNetworkDependencies

      - name: Verify release identity, signature and lint
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tool/sync_brand_assets.py --check
          python3 tool/verify_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --tag "$RELEASE_TAG" \
            --output build/release-verification.json

      - name: Rename APK with version tag
        run: |
          VERSION="${{ github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk \
             "Lianye-${VERSION}.apk"
          sha256sum "Lianye-${VERSION}.apk" > SHA256SUMS.txt

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            build/release-verification.json
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*

      - name: Determine pre-release flag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *"beta"* ]] || \
             [[ "${{ github.ref_name }}" == *"alpha"* ]] || \
             [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 连页 ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            Lianye-${{ github.ref_name }}.apk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-fdroid-repo:
    name: Deploy F-Droid Repository
    needs: build-and-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/fdroid-repo.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
